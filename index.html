<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskPlanner - To-Do & Reminders</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 0 0 20px 0;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* NAVBAR & HERO SECTION */
    .app-navbar {
      background: #4f46e5;
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-navbar .brand {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .btn-notif-perm {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .hero-section {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      color: #ffffff;
      padding: 24px 20px 28px 20px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }

    .hero-section h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .hero-section p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    /* CONTAINER UTAMA DENGAN MARGIN */
    .main-content {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* CARD UTAMA & KALENDER */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .calendar-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-nav {
      background: #f3f4f6;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      position: relative;
    }

    .day-cell.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .day-cell.selected {
      background: #4f46e5;
      color: #ffffff;
      font-weight: 700;
      border-color: #4f46e5;
    }

    .day-cell.today:not(.selected) {
      border: 2px solid #4f46e5;
      color: #4f46e5;
    }

    .task-dot {
      width: 4px;
      height: 4px;
      background-color: #ef4444;
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
    }

    .day-cell.selected .task-dot {
      background-color: #ffffff;
    }

    /* CARD DETAIL TANGGAL */
    .detail-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-header {
      font-size: 1rem;
      font-weight: 700;
      color: #111827;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 8px;
    }

    /* SECTION CATATAN */
    .note-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-section label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
    }

    .note-input {
      width: 100%;
      min-height: 60px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }

    .note-input:focus {
      border-color: #4f46e5;
    }

    /* FORM KEGIATAN DENGAN JAM */
    .task-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .task-form input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .task-form input[type="time"] {
      width: 110px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
    }

    .btn-add {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* LIST KEGIATAN */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .task-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-info {
      display: flex;
      flex-direction: column;
    }

    .task-time-badge {
      font-size: 0.72rem;
      color: #4f46e5;
      font-weight: 600;
      margin-top: 2px;
    }

    .btn-del {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: #9ca3af;
      font-size: 0.85rem;
      padding: 8px 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- NAVBAR -->
    <nav class="app-navbar">
      <div class="brand">TaskPlanner</div>
      <button class="btn-notif-perm" id="btnNotif">🔔 Aktifkan Notif</button>
    </nav>

    <!-- HERO SECTION -->
    <header class="hero-section">
      <h1>Kelola Jadwal Harian</h1>
      <p>Catat agenda, atur pengingat jam, dan pantau tugasmu.</p>
    </header>

    <div class="main-content">
      <!-- CARD KALENDER -->
      <div class="card">
        <div class="calendar-header">
          <button class="btn-nav" id="prevMonth">&lt;</button>
          <h2 id="monthYearTitle">-</h2>
          <button class="btn-nav" id="nextMonth">&gt;</button>
        </div>

        <div class="weekdays">
          <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
        </div>

        <div class="days-grid" id="daysGrid"></div>
      </div>

      <!-- CARD DETAIL DI BAWAH KALENDER -->
      <div class="card detail-card">
        <div class="detail-header" id="selectedDateTitle">Pilih Tanggal</div>

        <!-- CATATAN / NOTE -->
        <div class="note-section">
          <label for="noteInput">Catatan Hari Ini</label>
          <textarea id="noteInput" class="note-input" placeholder="Tulis catatan penting..."></textarea>
        </div>

        <!-- INPUT KEGIATAN & JAM -->
        <form class="task-form" id="taskForm">
          <div class="input-row">
            <input type="text" id="taskInput" placeholder="Tambah kegiatan..." required>
            <input type="time" id="timeInput" required>
          </div>
          <button type="submit" class="btn-add">+ Tambah Kegiatan</button>
        </form>

        <!-- LIST KEGIATAN -->
        <ul class="task-list" id="taskList"></ul>
      </div>
    </div>
  </div>

  <script>
    // CHROME STORAGE WRAPPER
    const Storage = {
      get: (key, callback) => {
        if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
          chrome.storage.local.get([key], (result) => callback(result[key] || null));
        } else {
          const data = localStorage.getItem(key);
          callback(data ? JSON.parse(data) : null);
        }
      },
      set: (key, value) => {
        if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
          chrome.storage.local.set({ [key]: value });
        } else {
          localStorage.setItem(key, JSON.stringify(value));
        }
      }
    };

    // DOM ELEMENTS
    const monthYearTitle = document.getElementById('monthYearTitle');
    const daysGrid = document.getElementById('daysGrid');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const btnNotif = document.getElementById('btnNotif');
    
    const selectedDateTitle = document.getElementById('selectedDateTitle');
    const noteInput = document.getElementById('noteInput');
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const timeInput = document.getElementById('timeInput');
    const taskList = document.getElementById('taskList');

    // STATE
    let currentDate = new Date();
    let selectedDateStr = '';
    let db = {};

    const monthNames = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    function formatDateKey(year, month, day) {
      const m = String(month + 1).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${year}-${m}-${d}`;
    }

    function saveDB() {
      Storage.set('todo_calendar_db', db);
    }

    // RENDER KALENDER
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthYearTitle.textContent = `${monthNames[month]} ${year}`;
      daysGrid.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        daysGrid.appendChild(emptyCell);
      }

      const today = new Date();
      const todayStr = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = formatDateKey(year, month, day);
        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell';
        dayCell.textContent = day;

        if (dateStr === todayStr) dayCell.classList.add('today');
        if (dateStr === selectedDateStr) dayCell.classList.add('selected');

        const entry = db[dateStr];
        if (entry && ((entry.tasks && entry.tasks.length > 0) || (entry.note && entry.note.trim() !== ''))) {
          const dot = document.createElement('div');
          dot.className = 'task-dot';
          dayCell.appendChild(dot);
        }

        dayCell.addEventListener('click', () => selectDate(dateStr, day, month, year));
        daysGrid.appendChild(dayCell);
      }
    }

    // SELECT DATE
    function selectDate(dateStr, day, month, year) {
      selectedDateStr = dateStr;
      selectedDateTitle.textContent = `${day} ${monthNames[month]} ${year}`;
      
      renderCalendar();
      renderDetailCard();
    }

    function renderDetailCard() {
      const entry = db[selectedDateStr] || { note: '', tasks: [] };

      noteInput.value = entry.note || '';

      taskList.innerHTML = '';
      if (!entry.tasks || entry.tasks.length === 0) {
        taskList.innerHTML = `<li class="empty-state">Belum ada kegiatan.</li>`;
        return;
      }

      // Sort tugas berdasarkan waktu
      entry.tasks.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      entry.tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="task-main">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
            <div class="task-info">
              <span class="task-text">${escapeHtml(task.text)}</span>
              ${task.time ? `<span class="task-time-badge">⏰ ${task.time}</span>` : ''}
            </div>
          </div>
          <button class="btn-del" onclick="deleteTask(${task.id})">&times;</button>
        `;
        taskList.appendChild(li);
      });
    }

    // AUTO-SAVE NOTE
    let noteTimeout;
    noteInput.addEventListener('input', () => {
      clearTimeout(noteTimeout);
      noteTimeout = setTimeout(() => {
        if (!selectedDateStr) return;
        if (!db[selectedDateStr]) db[selectedDateStr] = { note: '', tasks: [] };
        db[selectedDateStr].note = noteInput.value;
        
        saveDB();
        renderCalendar();
      }, 300);
    });

    // ADD TASK WITH TIME
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      const time = timeInput.value;
      if (!text || !selectedDateStr) return;

      if (!db[selectedDateStr]) db[selectedDateStr] = { note: '', tasks: [] };

      db[selectedDateStr].tasks.push({
        id: Date.now(),
        text: text,
        time: time,
        completed: false,
        notified: false
      });

      saveDB();
      renderDetailCard();
      renderCalendar();
      
      taskInput.value = '';
      timeInput.value = '';
    });

    // TOGGLE & DELETE TASK
    window.toggleTask = function(id) {
      if (!db[selectedDateStr]) return;
      db[selectedDateStr].tasks = db[selectedDateStr].tasks.map(t => 
        t.id === id ? { ...t, completed: !t.completed } : t
      );
      saveDB();
      renderDetailCard();
    };

    window.deleteTask = function(id) {
      if (!db[selectedDateStr]) return;
      db[selectedDateStr].tasks = db[selectedDateStr].tasks.filter(t => t.id !== id);
      saveDB();
      renderDetailCard();
      renderCalendar();
    };

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // NOTIFICATION SYSTEM
    btnNotif.addEventListener('click', () => {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            btnNotif.textContent = '✅ Notif Aktif';
            btnNotif.style.opacity = '0.7';
          } else {
            alert('Izin notifikasi ditolak.');
          }
        });
      } else {
        alert('Browser ini tidak mendukung Web Notifications.');
      }
    });

    function checkNotifications() {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      const now = new Date();
      const todayStr = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());
      const currentHours = String(now.getHours()).padStart(2, '0');
      const currentMinutes = String(now.getMinutes()).padStart(2, '0');
      const currentTimeStr = `${currentHours}:${currentMinutes}`;

      const todayEntry = db[todayStr];
      if (todayEntry && todayEntry.tasks) {
        todayEntry.tasks.forEach(task => {
          if (task.time === currentTimeStr && !task.notified && !task.completed) {
            new Notification('Pengingat Kegiatan!', {
              body: `${task.text} (${task.time})`,
              icon: 'https://cdn-icons-png.flaticon.com/512/2693/2693507.png'
            });
            task.notified = true;
            saveDB();
          }
        });
      }
    }

    // Cek waktu setiap 10 detik
    setInterval(checkNotifications, 10000);

    // NAVIGASI BULAN
    prevMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    // INIT
    Storage.get('todo_calendar_db', (data) => {
      if (data) db = data;
      
      const today = new Date();
      selectedDateStr = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());
      
      selectDate(selectedDateStr, today.getDate(), today.getMonth(), today.getFullYear());

      if ('Notification' in window && Notification.permission === 'granted') {
        btnNotif.textContent = '✅ Notif Aktif';
        btnNotif.style.opacity = '0.7';
      }
    });
  </script>
</body>
</html>
